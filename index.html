<!doctype html>
<html lang="en">
  <head>
    <!-- Kept here, not just in RootLayout's Head, because `npm run dev`
         serves this file raw with no prerendering step and no charset in
         its own Content-Type header either (checked: `curl -I` on the dev
         server returns plain "text/html") — dropping this would leave dev
         mode with no declared encoding at all. In the prerendered
         production build this ends up as a second, harmless charset
         declaration after the one RootLayout emits via Head, which lands
         first (see the comment there) purely to satisfy the Lighthouse
         audit that checks it is the very first thing in <head>. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Jost:ital,wght@0,300;0,400;1,300&family=Allura&family=Noto+Serif+Devanagari:wght@400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Netlify Forms detects submittable forms by scanning the deployed
         HTML at build time, not at runtime — the real form is rendered by
         React and posted via fetch() from submitLead.ts, so this static,
         hidden twin exists purely so Netlify's crawler has something to
         find and register. Field names must match the fetch() payload
         exactly. Kept here (outside #root, in the raw HTML template) so
         it survives on every prerendered page rather than needing its own
         route. See src/lib/submitLead.ts. -->
    <form name="lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="kind" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="category" />
      <input type="text" name="acknowledgedExportTerms" />
      <input type="text" name="meta" />
      <input name="bot-field" />
    </form>
  </body>
</html>
