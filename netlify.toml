[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Flip to "1" for production once real assets have replaced the placeholders.
  VITE_STRICT_ASSETS = "0"

# Routes are prerendered to real HTML files, so this only catches paths that
# have no prerendered page — it must NOT shadow them with the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
